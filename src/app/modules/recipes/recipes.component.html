<section class="recipes"><header><p>Producción / costos</p><h1>Recetas</h1></header><p class="error" *ngIf="error">{{error}}</p><div class="layout"><form (ngSubmit)="create()"><h2>Agregar ingrediente</h2><select required [(ngModel)]="form.menuItemId" name="menu"><option value="">Producto de menú</option><option *ngFor="let item of menu" [value]="item.id">{{item.name}}</option></select><select required [(ngModel)]="form.inventoryItemId" name="inventory"><option value="">Insumo</option><option *ngFor="let item of inventory" [value]="item.id">{{item.name}} ({{item.unit}})</option></select><input required type="number" min="0.01" step="0.01" [(ngModel)]="form.quantity" name="quantity" placeholder="Cantidad por porción"><button>Agregar a receta</button></form><div class="list"><h2>Ingredientes configurados</h2><article *ngFor="let recipe of recipes"><div><strong>{{recipe.menuItem.name}}</strong><span>{{recipe.inventoryItem.name}} · {{recipe.quantity}} {{recipe.inventoryItem.unit}}</span></div><button (click)="remove(recipe.id)">Quitar</button></article><p *ngIf="!recipes.length">Aún no hay recetas configuradas.</p></div></div></section>
