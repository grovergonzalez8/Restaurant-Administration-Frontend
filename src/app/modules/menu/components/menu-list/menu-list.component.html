<div class="menu-container">
  <div class="page-heading">
    <p>Catálogo / Operación</p>
    <h1>Menú</h1>
  </div>

  <mat-card class="toolbar-card">
    <mat-form-field appearance="outline">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="searchTerm" (keyup)="applyFilter()" placeholder="Buscar por nombre">
      <button *ngIf="searchTerm" matSuffix mat-icon-button (click)="searchTerm=''; applyFilter()">
        <mat-icon>close</mat-icon>
      </button>
    </mat-form-field>
  </mat-card>

  <mat-card>
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">

      <!-- Imagen -->
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef> Imagen </th>
        <td mat-cell *matCellDef="let item">
          <img [src]="item.imageUrl || 'https://via.placeholder.com/60'" class="thumb">
        </td>
      </ng-container>

      <!-- Nombre -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
        <td mat-cell *matCellDef="let item">{{ item.name }}</td>
      </ng-container>

      <!-- Precio -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Precio </th>
        <td mat-cell *matCellDef="let item">{{ item.price | currency:'USD':'symbol':'1.2-2' }}</td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let item">
          <button mat-icon-button color="primary" [routerLink]="['/menu', item.id]">
            <mat-icon>visibility</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
  </mat-card>

  <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>

</div>
