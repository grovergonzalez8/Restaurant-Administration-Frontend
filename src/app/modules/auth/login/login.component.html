<div class="login-container">
  <p class="eyebrow">Restaurant Administration</p>
  <h2>Bienvenido<br>a la operación.</h2>
  <p class="intro">Ingresa con tus credenciales para continuar.</p>

  <!-- Mensaje global de error -->
  <div class="global-error" role="alert" *ngIf="loginError">{{ loginError }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- Email -->
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com" autocomplete="email" [attr.aria-invalid]="f.email.invalid && f.email.touched" aria-describedby="email-error">
      <div class="error" id="email-error" *ngIf="f.email.invalid && (f.email.dirty || f.email.touched)">
        <span *ngIf="f.email.errors?.['required']">El correo es obligatorio.</span>
        <span *ngIf="f.email.errors?.['email']">Ingrese un correo válido.</span>
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="********" autocomplete="current-password" [attr.aria-invalid]="f.password.invalid && f.password.touched" aria-describedby="password-error">
      <div class="error" id="password-error" *ngIf="f.password.invalid && (f.password.dirty || f.password.touched)">
        <span *ngIf="f.password.errors?.['required']">La contraseña es obligatoria.</span>
      </div>
    </div>

    <button type="submit" [disabled]="form.invalid">Iniciar sesión <span>→</span></button>
  </form>
</div>
