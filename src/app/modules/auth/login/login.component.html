<div class="login-container">
  <h2>Iniciar Sesión</h2>

  <!-- Mensaje global de error -->
  <div class="global-error" *ngIf="loginError">{{ loginError }}</div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <!-- Email -->
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" formControlName="email" placeholder="ejemplo@correo.com">
      <div class="error" *ngIf="f.email.invalid && (f.email.dirty || f.email.touched)">
        <span *ngIf="f.email.errors?.['required']">El correo es obligatorio.</span>
        <span *ngIf="f.email.errors?.['email']">Ingrese un correo válido.</span>
      </div>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" placeholder="********">
      <div class="error" *ngIf="f.password.invalid && (f.password.dirty || f.password.touched)">
        <span *ngIf="f.password.errors?.['required']">La contraseña es obligatoria.</span>
      </div>
    </div>

    <button type="submit" [disabled]="form.invalid">Ingresar</button>
  </form>
</div>
