<div class="orders-list">
  <header class="page-heading swiss-heading">
    <p>Servicio / Tiempo real</p>
    <h1>Órdenes</h1>
    <a class="new-order" routerLink="/orders/new" *ngIf="canCreateOrder()">Nueva orden →</a>
  </header>

  <p class="state" aria-live="polite" *ngIf="loading">Actualizando órdenes…</p>
  <div class="error" role="alert" *ngIf="error">{{ error }} <button type="button" (click)="load()">Reintentar</button></div>
  <p class="empty" *ngIf="!loading && !error && !orders.length">No hay órdenes registradas.</p>

  <div class="table-wrap" *ngIf="!loading && orders.length">
    <table>
      <thead>
        <tr>
          <th>Orden</th>
          <th>Mesa</th>
          <th>Estado</th>
          <th class="numeric">Total</th>
          <th class="actions-column">Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let o of orders">
          <td class="order-code">#{{ o.id | slice:0:8 }}</td>
          <td><strong>{{ tableLabel(o.table) }}</strong></td>
          <td><span class="status" [attr.data-status]="o.status">{{ statusLabel(o.status) }}</span></td>
          <td class="numeric">{{ o.total | currency:'USD' }}</td>
          <td class="actions-column"><a [routerLink]="['/orders', o.id]" [attr.aria-label]="'Ver orden ' + (o.id | slice:0:8)">Ver →</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
