<section class="operations"><header><p>Control de insumos</p><h1>Inventario</h1></header><p class="error" *ngIf="error">{{error}}</p><div class="warn" *ngIf="low.length"><strong>Stock bajo</strong><span *ngFor="let item of low">{{item.name}}: {{item.quantity}} {{item.unit}}</span></div><div class="split"><form (ngSubmit)="create()"><h2>Nuevo insumo</h2><input required [(ngModel)]="item.name" name="name" placeholder="Nombre"><input [(ngModel)]="item.description" name="description" placeholder="Descripción"><div><input required type="number" min="0" [(ngModel)]="item.quantity" name="quantity" placeholder="Stock inicial"><input required type="number" min="0" [(ngModel)]="item.minStock" name="minStock" placeholder="Mínimo"></div><input required [(ngModel)]="item.unit" name="unit" placeholder="Unidad (kg, un, lt)"><button>Crear insumo</button></form><form (ngSubmit)="move()"><h2>Movimiento</h2><select required [(ngModel)]="movement.itemId" name="itemId"><option value="">Selecciona un insumo</option><option *ngFor="let item of items" [value]="item.id">{{item.name}} ({{item.quantity}} {{item.unit}})</option></select><select [(ngModel)]="movement.type" name="type"><option value="entry">Entrada</option><option value="output">Salida</option></select><input required type="number" min="0.01" step="0.01" [(ngModel)]="movement.quantity" name="moveQuantity" placeholder="Cantidad"><input [(ngModel)]="movement.note" name="note" placeholder="Nota"><button>Registrar movimiento</button></form></div><table><tr><th>Insumo</th><th>Stock</th><th>Mínimo</th><th>Unidad</th></tr><tr *ngFor="let item of items"><td>{{item.name}}</td><td>{{item.quantity}}</td><td>{{item.minStock ?? 0}}</td><td>{{item.unit}}</td></tr></table></section>
