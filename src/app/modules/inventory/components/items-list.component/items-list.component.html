<mat-card>
  <mat-card-title>Inventario</mat-card-title>

  <div class="actions">
    <button mat-flat-button color="primary" (click)="openCreate()">Nuevo item</button>
  </div>

  <div *ngIf="loading" class="loading">Cargando...</div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">

    <!-- name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nombre </th>
      <td mat-cell *matCellDef="let item"> {{item.name}} </td>
    </ng-container>

    <!-- quantity -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef> Cantidad </th>
      <td mat-cell *matCellDef="let item"> {{item.quantity}} </td>
    </ng-container>

    <!-- unit -->
    <ng-container matColumnDef="unit">
      <th mat-header-cell *matHeaderCellDef> Unidad </th>
      <td mat-cell *matCellDef="let item"> {{item.unit}} </td>
    </ng-container>

    <!-- actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let item">
        <button mat-icon-button (click)="view(item)" title="Ver"><mat-icon>visibility</mat-icon></button>
        <button mat-icon-button color="accent" (click)="openEdit(item)" title="Editar"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="remove(item)" title="Eliminar"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-card>
