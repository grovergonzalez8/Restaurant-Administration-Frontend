<section class="reservations"><header><p>Anfitrión / agenda</p><h1>Reservas</h1></header><p class="error" *ngIf="error">{{error}}</p><div class="layout"><form (ngSubmit)="create()"><h2>Nueva reserva</h2><select required [(ngModel)]="form.tableId" name="table"><option value="">Mesa libre</option><option *ngFor="let table of tables" [value]="table.id">Mesa {{table.number || table.name || table.id}}</option></select><input required [(ngModel)]="form.customerName" name="customerName" placeholder="Nombre del cliente"><input required [(ngModel)]="form.phone" name="phone" placeholder="Teléfono"><input type="email" [(ngModel)]="form.email" name="email" placeholder="Email (opcional)"><input required type="number" min="1" [(ngModel)]="form.guests" name="guests" placeholder="Comensales"><input required type="datetime-local" [(ngModel)]="form.reservationAt" name="reservationAt"><input [(ngModel)]="form.note" name="note" placeholder="Nota"><button>Guardar reserva</button></form><div class="list"><h2>Próximas</h2><article *ngFor="let reservation of reservations"><strong>{{reservation.customerName}}</strong><span>Mesa {{reservation.table?.number || reservation.tableId}} · {{reservation.guests}} personas</span><small>{{reservation.reservationAt | date:'medium'}}</small><div *ngIf="reservation.status === 'PENDING'"><button *ngFor="let state of states" (click)="status(reservation,state)">{{state}}</button></div></article><p *ngIf="!reservations.length">No hay reservas próximas.</p></div></div></section>
