<header class="app-header" *ngIf="auth.isAuthenticated()">
  <a class="brand" [routerLink]="homeRoute()">Restaurant Admin</a>
  <nav aria-label="Navegación principal">
    <a *ngIf="canViewDashboard()" routerLink="/dashboard" routerLinkActive="active">Panel</a>
    <a *ngIf="canManageKitchen()" routerLink="/kitchen" routerLinkActive="active">Cocina</a>
    <a *ngIf="canViewKitchenResources()" routerLink="/inventory" routerLinkActive="active">Inventario</a>
    <a *ngIf="canViewKitchenResources()" routerLink="/recipes" routerLinkActive="active">Recetas</a>
    <a *ngIf="canManageReservations()" routerLink="/reservations" routerLinkActive="active">Reservas</a>
    <a *ngIf="isAdmin()" routerLink="/reports" routerLinkActive="active">Reportes</a>
    <a *ngIf="canManageCash()" routerLink="/cash" routerLinkActive="active">Caja</a>
    <a routerLink="/menu" routerLinkActive="active">Menú</a>
    <a *ngIf="canViewOrders()" routerLink="/orders" routerLinkActive="active">Órdenes</a>
  </nav>
  <button type="button" (click)="logout()">Cerrar sesión</button>
</header>

<main class="app-content">
  <router-outlet />
</main>
